services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/openwebui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    networks:
      - CoreAgent
    
  db:
    image: postgres:18
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=openwebui
    networks:
      - CoreAgent

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    ports:
      - 8081:8081
    volumes:
      - ./models:/models
    environment:
      - GGML_CUDA_ENABLE_UNIFIED_MEMORY=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      -m /models/model.gguf
      -ngl 99
      -t 6
      --ctx-size 8192
      -fa on
      --host 0.0.0.0
      --port 8081
    networks:
      - CoreAgent
  
volumes:
  open-webui:
  db:
  llama-cpp:

networks:
  CoreAgent: