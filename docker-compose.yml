services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"
    env_file:
      - .env.webui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    networks:
      - CoreAgent
    
  db:
    image: postgres:18
    restart: always
    ports:
      - 5432:5432
    env_file:
      - .env.db
    networks:
      - CoreAgent

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    ports:
      - 8081:8081
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      -m /models/Qwen3.5-2B-Q4_K_M.gguf
      -ngl 99
      -t 6
      --ctx-size 8192
      -fa on
      --reasoning off
      --host 0.0.0.0
      --port 8081
    networks:
      - CoreAgent
  
volumes:
  open-webui:
  db:
  llama-cpp:

networks:
  CoreAgent: